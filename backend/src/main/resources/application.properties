
spring.application.name=backend

# Banco de dados
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Limita a quantidade de conexões com o Supabase
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# Evita manter conexões antigas por muito tempo
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.idle-timeout=300000

# Tempo máximo de espera por uma conexão
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=none

# JWT
jwt.secret=${JWT_SECRET}

# Serviço de envio de e-mails do SIA
sia.email.api-url=${SIA_EMAIL_API_URL:}
sia.email.api-key=${SIA_EMAIL_API_KEY:}

# Endereço do frontend para recuperação de senha

app.frontend-url=${FRONTEND_URL:http://127.0.0.1:5500/frontend}


# Configuração de upload de imagens
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

server.port=8080

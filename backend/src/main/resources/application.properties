spring.application.name=backend

# Banco de dados
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Limita a quantidade de conexões com o Supabase
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# Evita manter conexões antigas por muito tempo
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.idle-timeout=300000

# Tempo máximo de espera por uma conexão
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=none

# JWT
jwt.secret=${JWT_SECRET}

# Gmail do SIA
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SIA_EMAIL}
spring.mail.password=${SIA_EMAIL_APP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Evita ficar preso caso o servidor de e-mail não responda
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Endereço do frontend para recuperação de senha
app.frontend-url=${FRONTEND_URL:http://10.227.77.165:5500/frontend}

server.port=8080
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Usuários - Sistema de Almoxarifado</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- CSS próprio do projeto -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-slate-100">

    <div class="min-h-screen flex">

        <!-- Menu lateral -->
        <aside class="w-64 bg-blue-800 text-white p-6 flex flex-col">

            <div class="flex items-center gap-3 mb-10">
                <img src="assets/icons/blocks.svg" alt="Ícone do sistema" class="w-8 h-8">

                <h1 class="text-lg font-bold">
                    SIA
                </h1>
            </div>

            <nav class="space-y-3">

                <a href="./estoque.html"
                    class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-blue-700 transition">
                    <img src="assets/icons/package-plus.svg" alt="" class="w-5 h-5">

                    <span>Estoque</span>
                </a>

                <a href="./requisicoes.html"
                    class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-blue-700 transition">
                    <img src="assets/icons/clipboard-list.svg" alt="" class="w-5 h-5">

                    <span>Requisições</span>
                </a>

                <a href="./entrada.html"
                    class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-blue-700 transition">
                    <img src="assets/icons/package-plus.svg" alt="" class="w-5 h-5">

                    <span>Entrada</span>
                </a>

                <a href="./usuarios.html" class="flex items-center gap-3 bg-blue-700 px-4 py-3 rounded-lg">
                    <img src="assets/icons/house-plus.svg" alt="" class="w-5 h-5">

                    <span>Usuários</span>
                </a>

            </nav>

            <a href="login.html" id="botaoSair"
                class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-blue-700 transition mt-auto">
                <img src="assets/icons/log-out.svg" alt="" class="w-5 h-5">

                <span>Sair</span>
            </a>

        </aside>


        <!-- Área principal -->
        <div class="flex-1 min-h-screen flex flex-col">

            <main class="flex-1 p-8">

                <div class="mb-8">
                    <h2 class="text-3xl font-bold text-slate-800">
                        Usuários
                    </h2>

                    <p class="text-slate-500 mt-1">
                        Cadastre e gerencie os usuários do sistema.
                    </p>
                </div>


                <!-- Cadastro -->
                <section class="bg-slate-50 rounded-xl shadow-md p-6 mb-8">

                    <h3 class="text-xl font-semibold text-slate-800 mb-6">
                        Novo usuário
                    </h3>

                    <form id="formUsuario">

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

                            <div>
                                <label for="nomeUsuario" class="block text-sm font-medium text-slate-700 mb-2">
                                    Nome
                                </label>

                                <input type="text" id="nomeUsuario" placeholder="Digite o nome"
                                    class="w-full border border-slate-300 rounded-lg p-3 outline-none focus:border-blue-500">
                            </div>

                            <div>
                                <label for="emailUsuario" class="block text-sm font-medium text-slate-700 mb-2">
                                    E-mail
                                </label>

                                <input type="email" id="emailUsuario" placeholder="Digite o e-mail"
                                    class="w-full border border-slate-300 rounded-lg p-3 outline-none focus:border-blue-500">
                            </div>

                            <div>
                                <label for="senhaUsuario" class="block text-sm font-medium text-slate-700 mb-2">
                                    Senha
                                </label>

                                <input type="password" id="senhaUsuario" placeholder="Digite a senha"
                                    class="w-full border border-slate-300 rounded-lg p-3 outline-none focus:border-blue-500">
                            </div>

                            <div>
                                <label for="perfilUsuario" class="block text-sm font-medium text-slate-700 mb-2">
                                    Perfil
                                </label>

                                <select id="perfilUsuario"
                                    class="w-full border border-slate-300 rounded-lg p-3 outline-none focus:border-blue-500">
                                    <option value="usuario">
                                        Usuário
                                    </option>

                                    <option value="admin">
                                        Administrador
                                    </option>
                                </select>
                            </div>

                        </div>

                        <button type="submit"
                            class="mt-6 bg-blue-600 text-white font-semibold px-6 py-3 rounded-lg hover:bg-blue-700 transition">
                            Cadastrar usuário
                        </button>

                        <p id="mensagemUsuario" class="text-sm mt-4"></p>

                    </form>

                </section>


                <!-- Lista -->
                <section class="bg-slate-50 rounded-xl shadow-md overflow-hidden">

                    <div class="p-6 border-b border-slate-200">
                        <h3 class="text-xl font-semibold text-slate-800">
                            Usuários cadastrados
                        </h3>
                    </div>

                    <div class="overflow-x-auto">

                        <table class="w-full text-left">

                            <thead class="bg-blue-50 text-slate-700">
                                <tr>
                                    <th class="px-6 py-4 font-semibold">Nome</th>
                                    <th class="px-6 py-4 font-semibold">E-mail</th>
                                    <th class="px-6 py-4 font-semibold">Perfil</th>
                                    <th class="px-6 py-4 font-semibold">Status</th>
                                    <th class="px-6 py-4 font-semibold">Ação</th>
                                </tr>
                            </thead>

                            <tbody id="tabelaUsuarios" class="divide-y divide-slate-200">
                            </tbody>

                        </table>

                    </div>

                </section>

            </main>


            <!-- Rodapé -->
            <footer class="bg-slate-200 text-slate-600 text-sm text-center py-4">
                Sistema de Almoxarifado • 2026
            </footer>

        </div>

    </div>

    <!-- Confirmação para excluir usuário -->
    <div id="modalExcluir" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
        <div class="bg-slate-50 rounded-xl shadow-xl w-full max-w-md p-6">

            <h3 class="text-xl font-semibold text-slate-800 mb-3">
                Excluir usuário
            </h3>

            <p class="text-slate-600 mb-6">
                Tem certeza que deseja excluir este usuário?
            </p>

            <div class="flex justify-end gap-3">

                <button type="button" id="cancelarExclusao"
                    class="border border-slate-300 text-slate-700 font-semibold px-5 py-2 rounded-lg hover:bg-slate-100 transition">
                    Cancelar
                </button>

                <button type="button" id="confirmarExclusao"
                    class="bg-red-600 text-white font-semibold px-5 py-2 rounded-lg hover:bg-red-700 transition">
                    Excluir
                </button>

            </div>

        </div>
    </div>

    <script src="js/usuarios.js"></script>
    <script>
        const botaoSair = document.getElementById("botaoSair");

        botaoSair.addEventListener("click", function (event) {

            event.preventDefault();

            sessionStorage.removeItem("token");
            sessionStorage.removeItem("usuarioId");
            sessionStorage.removeItem("usuarioNome");
            sessionStorage.removeItem("usuarioPerfil");

            window.location.href = "login.html?logout=1";
        });
    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Estoque - Sistema de Almoxarifado</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- CSS próprio do projeto -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-slate-100">

    <div class="min-h-screen flex">

        <!-- Menu lateral -->
        <aside class="w-64 bg-blue-800 text-white p-6 flex flex-col">

            <div class="flex items-center gap-3 mb-10">
                <img src="assets/icons/blocks.svg" alt="Ícone do sistema" class="w-8 h-8">

                <h1 class="text-lg font-bold">
                    SIA
                </h1>
            </div>
            <nav class="space-y-3">

                <!-- Vai para Estoque -->
                <a href="./estoque.html" class="flex items-center gap-3 bg-blue-700 px-4 py-3 rounded-lg">
                    <img src="assets/icons/package-plus.svg" alt="" class="w-5 h-5">

                    <span>Estoque</span>
                </a>

                <!-- Vai para Requisições -->
                <a href="./requisicoes.html"
                    class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-blue-700 transition">
                    <img src="assets/icons/clipboard-list.svg" alt="" class="w-5 h-5">

                    <span>Requisições</span>
                </a>

                <!-- Vai para Entrada -->
                <a href="./entrada.html"
                    class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-blue-700 transition">
                    <img src="assets/icons/package-plus.svg" alt="" class="w-5 h-5">

                    <span>Entrada</span>
                </a>

                <!-- Usuários - visível somente para administrador -->
                <a href="./usuarios.html" id="menuUsuarios"
                    class="hidden flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-blue-700 transition">
                    <img src="assets/icons/house-plus.svg" alt="" class="w-5 h-5">

                    <span>Usuários</span>
                </a>

            </nav>
            <a href="login.html" id="botaoSair"
                class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-blue-700 transition mt-auto">

                <img src="assets/icons/log-out.svg" alt="" class="w-5 h-5">

                <span>Sair</span>
            </a>

        </aside>

        <!-- Conteúdo principal -->
        <div class="flex-1 min-h-screen flex flex-col">

            <main class="flex-1 p-8">
                <div class="mb-8">
                    <h2 class="text-3xl font-bold text-slate-800">
                        Estoque
                    </h2>

                    <p class="text-slate-500 mt-1">
                        Consulte os materiais disponíveis no almoxarifado.
                    </p>
                </div>
                <section class="bg-slate-50 rounded-xl shadow-md overflow-hidden">

                    <div class="p-6 border-b border-slate-200">
                        <h3 class="text-xl font-semibold text-slate-800">
                            Materiais disponíveis
                        </h3>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">

                            <thead class="bg-blue-50 text-slate-700">
                                <tr>
                                    <th class="px-6 py-4 font-semibold">Código</th>
                                    <th class="px-6 py-4 font-semibold">Material</th>
                                    <th class="px-6 py-4 font-semibold">Quantidade</th>
                                    <th class="px-6 py-4 font-semibold">Localização</th>
                                </tr>
                            </thead>

                            <tbody id="tabelaProdutos" class="divide-y divide-slate-200">

                            </tbody>

                        </table>
                    </div>

                </section>

            </main>

            <!-- Rodapé -->
            <footer class="bg-slate-200 text-slate-600 text-sm text-center py-4">
                Sistema de Almoxarifado • 2026
            </footer>

        </div>

    </div>

    <script src="js/estoque.js"></script>
    <script>
        const botaoSair = document.getElementById("botaoSair");

        botaoSair.addEventListener("click", function (event) {

            event.preventDefault();

            sessionStorage.removeItem("token");
            sessionStorage.removeItem("usuarioId");
            sessionStorage.removeItem("usuarioNome");
            sessionStorage.removeItem("usuarioPerfil");

            window.location.href = "login.html?logout=1";
        });
    </script>

</body>

</html>

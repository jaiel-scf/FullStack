<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrada - Sistema de Almoxarifado</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- CSS próprio do projeto -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-slate-100">

    <div class="min-h-screen flex">

        <!-- Menu lateral -->
        <aside class="w-64 bg-blue-800 text-white p-6 flex flex-col">

            <div class="flex items-center gap-3 mb-10">
                <img src="assets/icons/blocks.svg" alt="Ícone do sistema" class="w-8 h-8">

                <h1 class="text-lg font-bold">
                    SIA
                </h1>
            </div>
            <nav class="space-y-3">

                <!-- VAi para Estoque -->
                <a href="./estoque.html"
                    class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-blue-700 transition">
                    <img src="assets/icons/package-plus.svg" alt="" class="w-5 h-5">

                    <span>Estoque</span>
                </a>

                <!-- Vai para Requisições -->
                <a href="./requisicoes.html"
                    class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-blue-700 transition">
                    <img src="assets/icons/clipboard-list.svg" alt="" class="w-5 h-5">

                    <span>Requisições</span>
                </a>

                <!-- Vai para entrada -->
                <a href="./entrada.html" class="flex items-center gap-3 bg-blue-700 px-4 py-3 rounded-lg">
                    <img src="assets/icons/package-plus.svg" alt="" class="w-5 h-5">

                    <span>Entrada</span>
                </a>

                <!-- Usuários - visível somente para administrador -->
                <a href="./usuarios.html" id="menuUsuarios"
                    class="hidden flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-blue-700 transition">
                    <img src="assets/icons/house-plus.svg" alt="" class="w-5 h-5">

                    <span>Usuários</span>
                </a>

            </nav>
            <a href="login.html" id="botaoSair"
                class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-blue-700 transition mt-auto">

                <img src="assets/icons/log-out.svg" alt="" class="w-5 h-5">

                <span>Sair</span>
            </a>

        </aside>

        <!-- Conteúdo principal -->
        <div class="flex-1 min-h-screen flex flex-col">

            <main class="flex-1 p-8">
                <div class="mb-8">
                    <h2 class="text-3xl font-bold text-slate-800">
                        Entrada de Materiais
                    </h2>

                    <p class="text-slate-500 mt-1">
                        Registrar a entrada de materiais no estoque.
                    </p>
                </div>
                <section class="bg-slate-50 rounded-xl shadow-md p-6 max-w-3xl">

                    <h3 id="tituloNovaEntrada" class="text-xl font-semibold text-slate-800 mb-6">
                        Nova entrada
                    </h3>

                    <form id="formEntrada">

                        <!-- Produto -->
                        <div class="mb-5">

                            <label for="produtoEntrada" class="block text-sm font-medium text-slate-700 mb-2">
                                Produto
                            </label>

                            <div class="flex gap-3">

                                <select id="produtoEntrada"
                                    class="flex-1 border border-slate-300 rounded-lg p-3 outline-none focus:border-blue-500">
                                    <option value="">
                                        Selecione um produto
                                    </option>
                                </select>

                                <button type="button" id="botaoNovoProduto"
                                    class="bg-blue-600 text-white font-semibold px-5 rounded-lg hover:bg-blue-700 transition">
                                    Novo
                                </button>

                            </div>

                        </div>
                        <!-- Quantidade -->
                        <div class="mb-5">

                            <label for="quantidadeEntrada" class="block text-sm font-medium text-slate-700 mb-2">
                                Quantidade
                            </label>

                            <input type="number" id="quantidadeEntrada" min="1"
                                placeholder="Digite a quantidade recebida"
                                class="w-full border border-slate-300 rounded-lg p-3 outline-none focus:border-blue-500">

                        </div>

                        <!-- Observação -->
                        <div class="mb-6">

                            <label for="observacaoEntrada" class="block text-sm font-medium text-slate-700 mb-2">
                                Observação
                            </label>

                            <textarea id="observacaoEntrada" rows="3" placeholder="Ex.: Reposição de estoque"
                                class="w-full border border-slate-300 rounded-lg p-3 outline-none focus:border-blue-500 resize-none"></textarea>

                        </div>

                        <!-- Botão para registrar a entrada -->
                        <button type="submit"
                            class="bg-blue-600 text-white font-semibold px-6 py-3 rounded-lg hover:bg-blue-700 transition">
                            Registrar entrada
                        </button>

                        <p id="mensagemEntrada" class="text-sm mt-4"></p>

                    </form>
                    <!-- Cadastro de novo produto -->
                    <div id="cadastroNovoProduto" class="hidden mt-8 border-t border-slate-200 pt-6">

                        <h3 class="text-xl font-semibold text-slate-800 mb-6">
                            Cadastrar novo produto
                        </h3>

                        <form id="formNovoProduto">

                            <!-- Nome -->
                            <div class="mb-5">

                                <label for="nomeProduto" class="block text-sm font-medium text-slate-700 mb-2">
                                    Nome
                                </label>

                                <input type="text" id="nomeProduto" placeholder="Digite o nome do produto"
                                    class="w-full border border-slate-300 rounded-lg p-3 outline-none focus:border-blue-500">

                            </div>

                            <!-- Código -->
                            <div class="mb-5">

                                <label for="codigoProduto" class="block text-sm font-medium text-slate-700 mb-2">
                                    Código
                                </label>

                                <input type="text" id="codigoProduto" placeholder="Digite o código do produto"
                                    class="w-full border border-slate-300 rounded-lg p-3 outline-none focus:border-blue-500">

                            </div>

                            <!-- Descrição -->
                            <div class="mb-5">

                                <label for="descricaoProduto" class="block text-sm font-medium text-slate-700 mb-2">
                                    Descrição
                                </label>

                                <textarea id="descricaoProduto" rows="3" placeholder="Digite uma descrição"
                                    class="w-full border border-slate-300 rounded-lg p-3 outline-none focus:border-blue-500 resize-none"></textarea>

                            </div>

                            <!-- Localização -->
                            <div class="mb-6">

                                <label for="localizacaoProduto" class="block text-sm font-medium text-slate-700 mb-2">
                                    Localização
                                </label>

                                <input type="text" id="localizacaoProduto" placeholder="Ex.: Prateleira A2"
                                    class="w-full border border-slate-300 rounded-lg p-3 outline-none focus:border-blue-500">

                            </div>

                            <div class="flex gap-3">

                                <button type="button" id="cancelarNovoProduto"
                                    class="border border-slate-300 text-slate-700 font-semibold px-6 py-3 rounded-lg hover:bg-slate-100 transition">
                                    Cancelar
                                </button>

                                <button type="submit"
                                    class="bg-blue-600 text-white font-semibold px-6 py-3 rounded-lg hover:bg-blue-700 transition">
                                    Cadastrar produto
                                </button>

                            </div>

                            <p id="mensagemNovoProduto" class="text-sm mt-4"></p>

                        </form>

                    </div>

                </section>

            </main>

            <!-- Rodapé -->
            <footer class="bg-slate-200 text-slate-600 text-sm text-center py-4">
                Sistema de Almoxarifado • 2026
            </footer>

        </div>

    </div>

    <script src="js/entrada.js"></script>
    <script>
        const botaoSair = document.getElementById("botaoSair");

        botaoSair.addEventListener("click", function (event) {

            event.preventDefault();

            sessionStorage.removeItem("token");
            sessionStorage.removeItem("usuarioId");
            sessionStorage.removeItem("usuarioNome");
            sessionStorage.removeItem("usuarioPerfil");

            window.location.href = "login.html?logout=1";
        });
    </script>

</body>

</html>

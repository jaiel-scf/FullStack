<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Redefinir senha - Sistema de Almoxarifado</title>

    <link rel="icon" type="image/svg+xml" href="assets/icons/blocksAzul.svg">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-gradient-to-br from-slate-900 via-blue-800 to-sky-700">

    <main class="min-h-screen flex items-center justify-center p-4">

        <section class="bg-slate-50 p-8 rounded-2xl shadow-xl w-full max-w-md">

            <!-- Identidade -->
            <div class="flex justify-center mb-4">

                <div
                    class="w-16 h-16 bg-gradient-to-br from-sky-400 via-blue-500 to-blue-600 rounded-2xl flex items-center justify-center shadow-lg">

                    <img src="assets/icons/blocks.svg" alt="Ícone do sistema" class="w-9 h-9 brightness-0 invert">

                </div>

            </div>

            <div class="text-center">

                <h1 id="tituloPagina" class="text-3xl font-bold text-blue-800">

                    Redefinir senha

                </h1>

                <p id="descricaoPagina" class="text-gray-500 mt-2 mb-6">

                    Por segurança, altere sua senha antes de continuar.

                </p>

            </div>

            <form id="formRedefinirSenha">

                <!-- Senha atual -->
                <div id="grupoSenhaAtual" class="mb-4">

                    <label for="senhaAtual" class="block text-sm font-medium text-gray-700 mb-2">

                        Senha atual

                    </label>

                    <div class="flex items-center border border-gray-300 rounded-lg px-3 bg-white">

                        <img src="assets/icons/lock-keyhole-open.svg" alt="" class="w-5 h-5">

                        <input type="password" id="senhaAtual" placeholder="Digite sua senha atual"
                            class="w-full p-3 outline-none bg-transparent">

                        <button type="button" id="mostrarSenhaAtual" class="cursor-pointer" aria-label="Mostrar senha">

                            <img src="assets/icons/eye.svg" alt="" class="w-5 h-5">

                        </button>

                    </div>

                </div>

                <!-- Nova senha -->
                <div class="mb-4">

                    <label for="novaSenha" class="block text-sm font-medium text-gray-700 mb-2">

                        Nova senha

                    </label>

                    <div class="flex items-center border border-gray-300 rounded-lg px-3 bg-white">

                        <img src="assets/icons/lock-keyhole-open.svg" alt="" class="w-5 h-5">

                        <input type="password" id="novaSenha" placeholder="Digite a nova senha"
                            class="w-full p-3 outline-none bg-transparent" required>

                        <button type="button" id="mostrarNovaSenha" class="cursor-pointer" aria-label="Mostrar senha">

                            <img src="assets/icons/eye.svg" alt="" class="w-5 h-5">

                        </button>

                    </div>

                </div>

                <!-- Confirmar senha -->
                <div class="mb-6">

                    <label for="confirmarSenha" class="block text-sm font-medium text-gray-700 mb-2">

                        Confirmar nova senha

                    </label>

                    <div class="flex items-center border border-gray-300 rounded-lg px-3 bg-white">

                        <img src="assets/icons/lock-keyhole-open.svg" alt="" class="w-5 h-5">

                        <input type="password" id="confirmarSenha" placeholder="Digite novamente a nova senha"
                            class="w-full p-3 outline-none bg-transparent" required>

                        <button type="button" id="mostrarConfirmarSenha" class="cursor-pointer"
                            aria-label="Mostrar senha">

                            <img src="assets/icons/eye.svg" alt="" class="w-5 h-5">

                        </button>

                    </div>

                </div>

                <button type="submit" id="botaoAlterarSenha"
                    class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition">

                    Alterar senha

                </button>

                <p id="mensagemSenha" class="text-sm text-center mt-4">
                </p>

            </form>

        </section>

    </main>

    <script src="js/config.js"></script>
    <script src="js/redefinir-senha.js"></script>

</body>

</html>
